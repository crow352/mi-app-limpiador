<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Cleaner</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; padding: 20px; }
        .btn { background: #bb86fc; color: #000; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; margin-bottom: 20px; }
        .file-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #333; }
        .file-item input { margin-right: 15px; }
        #total { margin: 20px 0; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Limpiador</h1>
    <button class="btn" onclick="scan()">Escanear carpetas seguras</button>
    <div id="results"></div>
    <div id="total">Total seleccionado: 0 MB</div>
    <button class="btn" onclick="deleteFiles()">Eliminar seleccionados</button>

    <script src="capacitor.js"></script>
    <script>
        const { Filesystem, Directory } = Capacitor.Plugins;
        let foundFiles = [];

        async function scan() {
            await Filesystem.requestPermissions();
            foundFiles = [];
            const paths = ['Download', 'Pictures/Screenshots'];
            const container = document.getElementById('results');
            container.innerHTML = '';

            for (const path of paths) {
                try {
                    const contents = await Filesystem.readdir({ path, directory: Directory.ExternalStorage });
                    for (const file of contents.files) {
                        const stat = await Filesystem.stat({ path: `${path}/${file.name}`, directory: Directory.ExternalStorage });
                        const ext = file.name.split('.').pop().toLowerCase();
                        const sizeMB = stat.size / (1024 * 1024);

                        if (['apk', 'tmp', 'log', 'bak'].includes(ext) || (path === 'Download' && sizeMB > 50)) {
                            foundFiles.push({ path: `${path}/${file.name}`, size: sizeMB });
                            const div = document.createElement('div');
                            div.className = 'file-item';
                            div.innerHTML = `<input type="checkbox" data-path="${path}/${file.name}" data-size="${sizeMB}" onchange="updateTotal()"> <span>${file.name} (${sizeMB.toFixed(2)} MB)</span>`;
                            container.appendChild(div);
                        }
                    }
                } catch (e) { console.error(e); }
            }
        }

        function updateTotal() {
            let total = 0;
            document.querySelectorAll('input:checked').forEach(i => total += parseFloat(i.dataset.size));
            document.getElementById('total').innerText = `Total seleccionado: ${total.toFixed(2)} MB`;
        }

        async function deleteFiles() {
            const selected = document.querySelectorAll('input:checked');
            if (selected.length === 0) return;
            if (confirm(`¿Eliminar ${selected.length} archivos?`)) {
                for (const checkbox of selected) {
                    await Filesystem.deleteFile({ path: checkbox.dataset.path, directory: Directory.ExternalStorage });
                }
                scan();
            }
        }
    </script>
</body>
</html>
