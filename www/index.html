<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpiador</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; padding: 20px; }
        .btn { background: #bb86fc; color: #000; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; margin-bottom: 15px; font-size: 16px; }
        .btn-danger { background: #cf6679; }
        #status { background: #1e1e1e; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; color: #03dac6; }
        .file-item { display: flex; align-items: center; padding: 12px 5px; border-bottom: 1px solid #333; word-break: break-all; }
        .file-item input { margin-right: 12px; transform: scale(1.3); }
        #total { margin: 20px 0; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <h1>Limpiador</h1>
    <button class="btn" onclick="scan()">Escanear carpetas seguras</button>
    <div id="status">Listo para escanear.</div>
    <div id="results"></div>
    <div id="total">Total seleccionado: 0.00 MB</div>
    <button class="btn btn-danger" onclick="deleteFiles()">Eliminar seleccionados</button>

    <script>
        async function scan() {
            const status = document.getElementById('status');
            const container = document.getElementById('results');
            container.innerHTML = '';
            document.getElementById('total').innerText = 'Total seleccionado: 0.00 MB';

            try {
                const Filesystem = window.Capacitor?.Plugins?.Filesystem;
                if (!Filesystem) {
                    status.innerText = 'Error: Plugin Filesystem no cargado.';
                    return;
                }

                status.innerText = 'Verificando permisos...';
                try { await Filesystem.requestPermissions(); } catch (e) {}

                const paths = ['Download', 'Pictures/Screenshots', 'DCIM/Screenshots'];
                let count = 0;

                for (const path of paths) {
                    status.innerText = `Escaneando ${path}...`;
                    try {
                        const contents = await Filesystem.readdir({ path, directory: 'EXTERNAL_STORAGE' });
                        for (const file of contents.files) {
                            if (file.type === 'directory') continue;
                            const sizeMB = (file.size || 0) / (1024 * 1024);
                            const ext = file.name.split('.').pop().toLowerCase();

                            if (['apk', 'tmp', 'log', 'bak'].includes(ext) || (path === 'Download' && sizeMB > 10)) {
                                count++;
                                const div = document.createElement('div');
                                div.className = 'file-item';
                                div.innerHTML = `<input type="checkbox" data-path="${path}/${file.name}" data-size="${sizeMB}" onchange="updateTotal()"> <span><b>[${path}]</b> ${file.name} (${sizeMB.toFixed(2)} MB)</span>`;
                                container.appendChild(div);
                            }
                        }
                    } catch (err) {
                        status.innerText = `Aviso en ${path}: ${err.message || err}. Revisa permisos de archivos en Ajustes.`;
                    }
                }

                if (count > 0) {
                    status.innerText = `Escaneo listo: ${count} archivos encontrados.`;
                } else if (!status.innerText.startsWith('Aviso')) {
                    status.innerText = 'Escaneo terminado: No se encontraron archivos basura o pesados.';
                }
            } catch (globalErr) {
                status.innerText = 'Error: ' + (globalErr.message || globalErr);
            }
        }

        function updateTotal() {
            let total = 0;
            document.querySelectorAll('input:checked').forEach(i => total += parseFloat(i.dataset.size));
            document.getElementById('total').innerText = `Total seleccionado: ${total.toFixed(2)} MB`;
        }

        async function deleteFiles() {
            const Filesystem = window.Capacitor?.Plugins?.Filesystem;
            const selected = document.querySelectorAll('input:checked');
            if (selected.length === 0) return;

            if (confirm(`¿Eliminar ${selected.length} archivos seleccionados?`)) {
                let deleted = 0;
                for (const checkbox of selected) {
                    try {
                        await Filesystem.deleteFile({ path: checkbox.dataset.path, directory: 'EXTERNAL_STORAGE' });
                        deleted++;
                    } catch (e) {
                        alert('No se pudo borrar ' + checkbox.dataset.path + ': ' + (e.message || e));
                    }
                }
                alert(`Se eliminaron ${deleted} archivos.`);
                scan();
            }
        }
    </script>
</body>
</html>
