name: Compilar CrowClean APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias, ícono personalizado y Android
        run: |
          npm install
          npx cap add android
          rm -f ~/.android/debug.keystore
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CrowClean,O=Crow,C=MX" -noprompt
          pip install pillow
          python3 -c '
          import glob
          from PIL import Image
          p = "android/app/src/main/AndroidManifest.xml"
          txt = open(p).read()
          perms = """
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
          """
          txt = txt.replace("<application", perms + "\n    <application", 1)
          open(p, "w").write(txt)

          src = Image.open("icon.png").convert("RGBA")
          for icon_path in glob.glob("android/app/src/main/res/mipmap-*/ic_launcher*.png"):
              im = Image.open(icon_path)
              resized = src.resize(im.size, Image.Resampling.LANCZOS)
              resized.save(icon_path)
          '
          npx cap sync android

      - name: Compilar CrowClean APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../CrowClean.apk

      - name: Subir CrowClean APK
        uses: actions/upload-artifact@v4
        with:
          name: CrowClean-APK
          path: CrowClean.apk
